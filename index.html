<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    
    <title>Kanban</title>
</head>
<body>
    <main>
        <dialog id="modal-add-card">
            <label>Titulo</label>
            <input id="title-input-modal" type="text">
            <label>Descrição</label>
            <input id="descri-input-modal" type="text">
            <label>Entrega</label>
            <input id="date-input-modal" type="date">
            <button id="save-card-button" >Salvar</button>
            <button id="cancel-card-button" >Cancelar</button>
        </dialog>
        
        <div class="kanban-column" id="col-todo">
            <h3 class="label-column">Para Fazer</h3>
            <a id="todo-add-card" class="add-card">Adicionar Card</a>
            <div id="todo" class="cards">
            </div>
        </div>

        <div class="kanban-column" id="col-doing">
            <h3 class="label-column">Fazendo</h3>
            <div id="doing" class="cards">
            </div>
        </div>

        <div class="kanban-column" id="col-done">
            <h3 class="label-column">Feito</h3>
            <div id="done" class="cards">
            </div>
        </div>
    </main>

    <a id="save-board" onclick="saveDataBoard()">Salvar Conteúdo</a>

</body>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="DragAndDrop.js"></script>
    <script src="Cards.js"></script>
    <script src="SaveBoard.js"></script>
</html>
